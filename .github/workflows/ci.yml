name: CI

on:
    push:
        branches: [main, development]
    pull_request:
        branches: [main, development]

# Newer pushes cancel in-flight runs on the same branch/PR.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build & i18n parity
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            # The lockfile is generated with npm 11 (local dev). node 22 ships npm 10,
            # whose `npm ci` dies on esbuild's cross-platform optional deps (EBADPLATFORM)
            # — the same failure that broke the Railway Docker build. Pin npm 11 to match.
            - name: Pin npm 11
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: i18n catalog parity (en/uk)
              run: node .github/scripts/i18n-parity.mjs

            - name: Build
              run: npm run build

    quality:
        name: Lint & format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Pin npm 11
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: ESLint
              run: npm run lint

            - name: Prettier check
              run: npm run format:check
